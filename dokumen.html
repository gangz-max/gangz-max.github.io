<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DropZone - Dokumen</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header class="navbar">

    <div class="logo">
        <span>DROP</span>ZONE
    </div>

    <nav>

        <a href="index.html">Home</a>
        <a href="aplikasi.html">Aplikasi</a>
        <a href="game.html">Game</a>
        <a href="dokumen.html">Dokumen</a>
        <a href="tools.html">Tools</a>

    </nav>

</header>



<section class="downloads-page">

    <div class="page-title">

        <p>
            DOWNLOAD
        </p>

        <h1>
            Dokumen
        </h1>

        <span>
            Modul, PDF, Word dan berbagai dokumen lainnya.
        </span>

    </div>



    <div class="download-grid">


        <div class="download-card">

            <div class="file-icon red">
                PDF
            </div>

            <div class="file-info">

                <h3>
                    Panduan Networking
                </h3>

                <p>
                    Modul pembelajaran jaringan
                </p>

                <div class="file-detail">

                    <span>PDF</span>
                    <span>8 MB</span>
                    <span>v1.0</span>

                </div>

            </div>


            <a
                href="files/dokumen/panduan-networking.pdf"
                class="download-btn"
                download
            >
                ↓
            </a>

        </div>


        <div class="download-card">

            <div class="file-icon blue">
                DOC
            </div>

            <div class="file-info">

                <h3>
                    Modul HTML
                </h3>

                <p>
                    Modul pembelajaran HTML
                </p>

                <div class="file-detail">

                    <span>DOCX</span>
                    <span>5 MB</span>
                    <span>v1.0</span>

                </div>

            </div>


            <a
                href="files/dokumen/modul-html.docx"
                class="download-btn"
                download
            >
                ↓
            </a>

        </div>


    </div>

</section>


</body>

</html>
