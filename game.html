<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DropZone - Game</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header class="navbar">

    <div class="logo">
        <span>DROP</span>ZONE
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="aplikasi.html">
            Aplikasi
        </a>

        <a href="game.html">
            Game
        </a>

        <a href="dokumen.html">
            Dokumen
        </a>

        <a href="tools.html">
            Tools
        </a>

    </nav>

</header>



<section class="downloads-page">

    <div class="page-title">

        <p>
            DOWNLOAD
        </p>

        <h1>
            Game
        </h1>

        <span>
            Koleksi game yang tersedia untuk diunduh.
        </span>

    </div>



    <div class="download-grid">


        <div class="download-card">

            <div class="file-icon green">
                APK
            </div>

            <div class="file-info">

                <h3>
                    Example Game
                </h3>

                <p>
                    Game Android
                </p>

                <div class="file-detail">

                    <span>
                        Android
                    </span>

                    <span>
                        150 MB
                    </span>

                    <span>
                        v3.0
                    </span>

                </div>

            </div>


            <a
                href="files/game/example-game.apk"
                class="download-btn"
                download
            >
                ↓
            </a>

        </div>


        <div class="download-card">

            <div class="file-icon green">
                ZIP
            </div>

            <div class="file-info">

                <h3>
                    Example Game 2
                </h3>

                <p>
                    Game PC
                </p>

                <div class="file-detail">

                    <span>
                        Windows
                    </span>

                    <span>
                        500 MB
                    </span>

                    <span>
                        v1.0
                    </span>

                </div>

            </div>


            <a
                href="files/game/example-game-2.zip"
                class="download-btn"
                download
            >
                ↓
            </a>

        </div>


    </div>

</section>


</body>

</html>
